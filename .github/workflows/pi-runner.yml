name: Pi Runner Smoke Test

# Proves the self-hosted Raspberry Pi runner is alive and correctly labeled.
#
# Dispatch-only on purpose: until a runner is registered (terraform/ansible
# bring one up), a push-triggered run would sit queued forever waiting for a
# runner that matches [self-hosted, linux, arm64, pi]. Dispatch it manually
# once the runner is online: gh workflow run pi-runner.yml
#
# SECURITY NOTE: self-hosted runners on a PUBLIC repo can be triggered by any
# third party PR (approve/require-review not enforced by Actions). Restrict
# triggers to trusted branches/paths and review the Security section in README.

on:
  workflow_dispatch:

concurrency:
  group: pi-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-info:
    # The runner context is not available in job-level "name" (GitHub rejects
    # the whole workflow on it); the hostname is printed by the first step and
    # names the artifact below instead.
    name: "On the Pi"
    # Must match the labels the runner was registered with (terraform var
    # runner_labels). The runner only accepts jobs matching its labels.
    runs-on: [self-hosted, linux, arm64, pi]
    timeout-minutes: 10
    steps:
      - name: Identify hardware
        run: |
          echo "hostname : $(hostname)"
          echo "kernel   : $(uname -a)"
          echo "os       : $(cat /etc/os-release | grep PRETTY_NAME)"
          echo "arch     : $(uname -m)"
          cat /proc/cpuinfo | grep -m1 'Model'

      - name: Drop a build artifact to prove job execution
        run: |
          mkdir -p artifact
          uname -m > artifact/architecture.txt
          date --iso-8601=seconds > artifact/built-at.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-runner-${{ runner.name }}
          path: artifact/
