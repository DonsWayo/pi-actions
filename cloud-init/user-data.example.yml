#cloud-config
#
# Reference example only — in practice this file is GENERATED by
# `terraform apply` (terraform/generated/user-data) or by `scripts/flash.sh`.
# Do not commit a real token. Copied here for readability / manual flashing.
#
# On first boot Raspberry Pi OS (Bookworm+) passes this to cloud-init, which
# installs Ansible and pulls THIS repo's bootstrap playbook. The Pi then
# registers itself as a GitHub Actions runner with zero SSH.

hostname: pi-runner-01
preserve_hostname: false
timezone: UTC
manage_etc_hosts: true

ssh_pwauth: false
disable_root: true

write_files:
  # Replaced by the real (1h) registration token during generation.
  - path: /etc/pi-actions/registration-token
    permissions: "0600"
    owner: root:root
    content: |
      REPLACE_WITH_TERRAFORM_OUTPUT

runcmd:
  - |
    set -eu
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -y
    apt-get install -y git ca-certificates curl
    if ! command -v ansible-pull >/dev/null 2>&1; then
      apt-get install -y ansible-core || apt-get install -y ansible
    fi
    ansible-pull \
      -U https://github.com/YOUR_OWNER/pi-actions.git \
      -C main -i localhost, --accept-new-host-key \
      -e "runner_scope=repo runner_name=pi-runner-01 runner_user=runner runner_group=default runner_labels=self-hosted,linux,arm64,pi repo_name=pi-actions github_owner=YOUR_OWNER" \
      ansible/playbooks/bootstrap.yml
